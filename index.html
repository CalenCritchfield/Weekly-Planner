<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekly Goal Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Prevent zooming and ensure proper mobile rendering -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no"
    />

    <!-- Prevent iOS telephone number detection -->
    <meta name="format-detection" content="telephone=no" />
    <!-- Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS Safari PWA tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Daily Goals" />
    <link rel="apple-touch-icon" href="Weekly Planner.png" />

    <!-- Theme Color for Chrome, Firefox OS and Opera -->
    <meta name="theme-color" content="#4caf50" />
  </head>
  <body>
    <h1>Daily Goals Tracker</h1>
    <div class="stats">
      <div class="stat-box">
        <div class="stat-value" id="total-goals">0</div>
        <div class="stat-label">Total Goals</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="completed-goals">0</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" id="completion-percentage">0%</div>
        <div class="stat-label">Completion Rate</div>
      </div>
      <!-- Streak counter will be added via JavaScript -->
    </div>
    <!-- Achievements section will be added via JavaScript -->
    <div class="days-container" id="days-container">
      <!-- Days will be populated by JavaScript -->
    </div>
    <script src="script.js"></script>
  </body>
</html>
